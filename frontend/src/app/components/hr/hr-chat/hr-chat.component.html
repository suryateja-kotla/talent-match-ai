<div class="chat-wrapper d-flex flex-column h-100">
  <div
    class="chat-messages flex-grow-1"
    #scrollContainer
    style="overflow-y: auto; min-height: 0"
  >
    <div
      *ngFor="let msg of messages"
      class="chat-message"
      [ngClass]="msg.from === 'user' ? 'user-msg' : 'bot-msg'"
    >
      <div class="message-bubble">
        {{ msg.text }}
      </div>
    </div>

    <div *ngIf="isLoading" class="chat-message bot-msg">
      <div class="message-bubble typing">🤖 Thinking...</div>
    </div>
  </div>

  <div class="chat-input-wrapper mt-auto">
    <div class="chat-input d-flex align-items-center">
      <input
        [(ngModel)]="userInput"
        placeholder="Describe the job..."
        (keyup.enter)="sendMessage()"
      />
      <button (click)="sendMessage()">
        <i class="bi bi-send"></i>
      </button>
    </div>
  </div>
</div>
