<div class="d-flex justify-content-between align-items-center mb-1">
  <h5 class="fw-bold m-0">Job Postings</h5>
  <div
    *ngIf="isLoading"
    class="spinner-border spinner-border-sm text-primary"
    role="status"
  ></div>
</div>

<small class="text-muted mb-3 d-block" *ngIf="!isLoading">
  {{ jobs.length }} active listing{{ jobs.length !== 1 ? "s" : "" }}
</small>

<!-- EMPTY STATE -->
<div *ngIf="jobs.length === 0" class="text-center text-muted mt-5 pt-5">
  <i class="bi bi-briefcase fs-1 d-block mb-3 opacity-25"></i>
  <p>No active job postings yet.<br />Use the chat to create one!</p>
</div>

<!-- JOB LIST -->
<div class="row g-3 mt-1">
  <div class="col-12 col-md-6 col-xl-4" *ngFor="let job of jobs">
    <div class="job-card p-3 border rounded-3 h-100">
      <div class="d-flex justify-content-between align-items-start">
        <h6 class="fw-bold mb-1">{{ job.title }}</h6>
        <span class="badge bg-success-subtle text-success">active</span>
      </div>

      <div class="mt-2 d-flex flex-wrap gap-1">
        <span
          class="badge bg-primary bg-opacity-10 text-primary"
          *ngFor="let skill of job.skills"
        >
          {{ skill }}
        </span>

        <span *ngIf="!job.skills?.length" class="text-muted small">
          No skills listed
        </span>
      </div>

      <div class="mt-3 job-info small text-muted">
        <div><i class="bi bi-briefcase me-1"></i>{{ job.exp }}</div>
        <div><i class="bi bi-geo-alt me-1"></i>{{ job.location }}</div>
        <div>
          <i class="bi bi-people me-1"></i>
          {{ job.positions }} position{{ job.positions !== 1 ? "s" : "" }}
        </div>
      </div>
    </div>
  </div>
</div>
