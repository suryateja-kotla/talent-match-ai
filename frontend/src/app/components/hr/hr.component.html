<div class="container-fluid hr-page p-3">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-shrink-0">
    <h4 class="fw-bold m-0 text-white">TalentMatch.ai</h4>
    <div class="d-flex gap-2">
      <button class="btn btn-light fw-bold d-none d-md-block">HR Dashboard</button>
      <button class="btn btn-outline-danger btn-sm" (click)="logout()">-> Logout</button>
    </div>
  </div>

  <div class="row dashboard-row g-3">
    <div class="col-12 col-lg-4 chat-column" [class.mobile-visible]="showMobileChat">
      <div class="card dark-card shadow">
        <div class="chat-header d-flex justify-content-between align-items-center">
          <span>Hiring Assistant</span>
          <button class="btn-close btn-close-white d-lg-none" (click)="toggleChat()"></button>
        </div>
        <div class="flex-grow-1 p-2 overflow-hidden">
          <app-hr-chat (jobCreated)="handleJobCreated()"></app-hr-chat>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-8 jobs-column">
      <div class="card dark-card shadow p-3">
        <app-hr-jobs #jobsList></app-hr-jobs>
      </div>
    </div>
  </div>

  <button class="btn btn-primary chat-fab d-lg-none" (click)="toggleChat()">
    <i class="bi" [ngClass]="showMobileChat ? 'bi-x-lg' : 'bi-chat-dots-fill'"></i>
  </button>
</div>
