<div class="container-fluid min-vh-100 login-page">
  <div class="row min-vh-100">
    <div
      class="col-lg-6 d-none d-lg-flex flex-column justify-content-center align-items-center text-white welcome-section text-center p-5"
    >
      <div class="welcome-content">
        <h1 class="display-4 fw-bold mb-3">
          Welcome to <span class="text-highlight">Talent Match</span>
        </h1>

        <p class="lead text-muted-light">
          Connecting the right people with the right opportunities.
        </p>

        <div class="static-icon-container">
          <i class="bi bi-people-fill"></i>
        </div>
      </div>
    </div>

    <div
      class="col-lg-6 d-flex justify-content-center align-items-center login-form-section"
    >
      <div class="card shadow-lg p-5 login-card">
        <div class="text-center mb-4 d-lg-none">
          <h2 class="fw-bold text-highlight">Talent Match</h2>
        </div>

        <h3 class="text-center mb-4 fw-semibold">Log In</h3>
        <form (ngSubmit)="login()">
          <div class="mb-4">
            <label class="form-label small text-muted">Username</label>
            <div class="input-group custom-input-group">
              <span class="input-group-text">
                <i class="bi bi-person"></i>
              </span>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="username"
                name="username"
                placeholder="Enter username"
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small text-muted">Password</label>
            <div class="input-group custom-input-group">
              <span class="input-group-text">
                <i class="bi bi-lock"></i>
              </span>
              <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="password"
                name="password"
                placeholder="Enter password"
              />
            </div>
          </div>

          <button
            class="btn btn-primary w-100 login-btn py-2 mt-2"
            (click)="login()"
            [disabled]="loading"
          >
            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm me-2"
            ></span>
            <span>{{ loading ? "Signing in..." : "Login" }}</span>
            <i *ngIf="!loading" class="bi bi-arrow-right ms-2"></i>
          </button>
        </form>

        <div *ngIf="message" class="text-center text-danger mt-3 small">
          <i class="bi bi-exclamation-circle me-1"></i> {{ message }}
        </div>
      </div>
    </div>
  </div>
</div>
