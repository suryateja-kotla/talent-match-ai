<div class="container-fluid vh-100 d-flex flex-column p-3">

  <!-- TOP BAR -->
  <div class="d-flex justify-content-between align-items-center mb-3">

    <h4 class="fw-bold m-0">
      TalentMatch
      <span class="badge bg-primary ms-2">ATS</span>
    </h4>

    <div class="d-flex align-items-center gap-3">

      <button class="btn btn-light fw-bold">
        User Dashboard
      </button>

      <span class="text-muted">
        👤 {{ username }}
      </span>

      <button class="btn btn-outline-danger" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>

    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="row flex-grow-1 g-3">

    <!-- LEFT: CHAT -->
    <div class="col-12 col-lg-4 d-flex flex-column">
      <div class="card h-100 shadow-sm p-2 ">
        <app-chatbot></app-chatbot>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="col-12 col-lg-8 d-flex flex-column">

      <!-- JOB MATCHES -->
      <div class="card shadow-sm mb-3 flex-grow-1 overflow-auto">
        <div class="p-3 h-100">
          <app-job-matches></app-job-matches>
        </div>
      </div>

      <!-- APPLICATIONS -->
      <div class="card shadow-sm flex-grow-1 overflow-auto">
        <div class="p-3 h-100">
          <app-applications></app-applications>
        </div>
      </div>

    </div>

  </div>

</div>
