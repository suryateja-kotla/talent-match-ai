<div
  class="container-fluid d-flex flex-column user-page vh-100-desktop p-3 overflow-hidden-desktop"
>
  <div
    class="d-flex justify-content-between align-items-center mb-3 flex-shrink-0"
  >
    <h4 class="fw-bold m-0 logo-text">
      TalentMatch<span class="text-highlight">.ai</span>
    </h4>

    <div class="d-flex align-items-center gap-2 gap-md-3">
      <button class="btn btn-light fw-bold d-none d-md-block">
        User Dashboard
      </button>
      <span class="text-muted small"
        >👤 <span class="d-none d-sm-inline">{{ username }}</span></span
      >
      <button class="btn btn-outline-danger btn-sm" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span class="d-none d-md-inline ms-1">Logout</span>
      </button>
    </div>
  </div>

  <div class="row flex-grow-1 g-3 dashboard-row" style="min-height: 0">
  <div class="col-lg-4 d-none d-lg-flex flex-column chat-column" [class.mobile-active]="showMobileChat">
    <div class="card h-100 shadow-sm p-2 d-flex flex-column dark-card">
      <app-chatbot class="flex-grow-1"></app-chatbot>
    </div>
  </div>

  <div class="col-12 col-lg-8 d-flex flex-column" style="height: calc(100vh - 100px); overflow: hidden;">
    
    <div class="card shadow-sm mb-3 dark-card flex-section-box">
      <div class="p-3 h-100 scroll-area-internal">
        <app-hr-jobs></app-hr-jobs>
      </div>
    </div>

    <div class="card shadow-sm dark-card flex-section-box">
      <div class="p-3 h-100 scroll-area-internal">
        <app-applications #appsList [candidateId]="currentCandidateId"></app-applications>
      </div>
    </div>
    

  </div>
</div>
  <button class="btn btn-primary chat-fab d-lg-none" (click)="toggleChat()">
    <i
      class="bi"
      [ngClass]="showMobileChat ? 'bi-x-lg' : 'bi-chat-dots-fill'"
    ></i>
  </button>
</div>
