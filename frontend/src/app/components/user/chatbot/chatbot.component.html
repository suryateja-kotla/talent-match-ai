<div class="chat-wrapper">
  <div class="chat-header">Job Assistant</div>

  <div class="chat-messages" #scrollContainer>
    @for (msg of messages; track $index) {
      <div class="chat-message" [ngClass]="msg.sender === 'user' ? 'user-msg' : 'bot-msg'">
        <div class="message-bubble">
          {{ msg.text }}
        </div>
      </div>
    }

    <div *ngIf="isLoading" class="chat-message bot-msg">
      <div class="message-bubble typing">
        <span>🤖 Thinking</span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <div class="chat-upload" *ngIf="!resumeUploaded">
    <label class="small text-muted mb-1 d-block">Upload Resume to begin</label>
    <input type="file" (change)="onFileSelected($event)" class="form-control form-control-sm" />
  </div>

  <div class="chat-input-wrapper">
    <div class="chat-input-box">
      <input
        [(ngModel)]="userInput"
        placeholder="Type your message..."
        (keydown)="handleKeyDown($event)"
      />
      <button (click)="sendMessage()" [disabled]="isLoading">
        <i class="bi bi-send"></i>
      </button>
    </div>
  </div>
</div>
